server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: любой неизвестный путь -> index.html (клиентский роутер Vue Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy на backend, совместимо с VITE_API_BASE_URL=/api
    # и CORS same-origin настройкой FRONTEND_ORIGIN на backend.
    location /api/ {
        proxy_pass http://${BACKEND_UPSTREAM}/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / /;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
