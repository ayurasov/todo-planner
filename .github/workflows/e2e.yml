name: E2E smoke (Playwright)

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for docker compose
        run: |
          cp .env.example .env
          sed -i "s#^SECRET_KEY=.*#SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_hex(32))')#" .env
          sed -i "s#^POSTGRES_PASSWORD=.*#POSTGRES_PASSWORD=e2e-ci-password#" .env

      - name: Build and start docker compose stack
        run: docker compose up -d --build

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost/api/health; then exit 0; fi
            sleep 2
          done
          echo "backend did not become healthy in time" >&2
          docker compose logs
          exit 1

      - name: Seed deterministic E2E users/data
        run: docker compose exec -T backend env FLASK_ENV=testing python seed_e2e_data.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Docker compose down
        if: always()
        run: docker compose down -v
